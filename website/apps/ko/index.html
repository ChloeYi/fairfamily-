<style>
  :root { --bg:#f6f9ff; --text:#25324a; --sub:#7683a0; --accent:#3d7bff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font-family:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
         background-image:radial-gradient(#dde8f8 1.5px, transparent 1.5px); background-size:22px 22px; }
  main { max-width:480px; margin:0 auto; padding:36px 20px 56px; }
  header { text-align:center; margin-bottom:26px; }
  h1 { font-family:"Jua",sans-serif; font-weight:400; font-size:30px; margin:0 0 6px; letter-spacing:-.5px; }
  h1 span { color:var(--accent); }
  .lead { color:var(--sub); font-size:15px; margin:0; }
  .card { display:flex; align-items:center; gap:14px; background:var(--tint,#fff); border:2.5px solid #fff;
          border-radius:24px; padding:14px 16px 14px 14px; margin-bottom:14px; text-decoration:none; color:inherit;
          box-shadow:0 6px 0 rgba(40,70,120,.08), 0 10px 24px rgba(40,70,120,.08);
          transition:transform .15s; -webkit-tap-highlight-color:transparent; }
  .card:hover { transform:translateY(-2px) rotate(-.4deg); }
  .card:active { transform:translateY(2px) scale(.99); box-shadow:0 2px 0 rgba(40,70,120,.08); }
  .icon { width:62px; height:62px; border-radius:18px; flex:none; background:#fff; object-fit:cover;
          box-shadow:0 3px 8px rgba(0,0,0,.12);
          display:flex; align-items:center; justify-content:center; font-family:"Jua",sans-serif; font-size:26px; color:var(--sub); }
  .body { flex:1; min-width:0; word-break:keep-all; }
  .card h2 { font-family:"Jua",sans-serif; font-weight:400; font-size:18px; margin:0 0 3px; line-height:1.25; }
  .card p { font-size:13.5px; color:var(--sub); margin:0; line-height:1.4; }
  .get { flex:none; padding:9px 15px; border-radius:999px; background:var(--accent); color:#fff;
         font-family:"Jua",sans-serif; font-size:15px; box-shadow:0 3px 0 rgba(0,0,0,.12); }
  .hero { background:linear-gradient(135deg,#d9e8ff,#dff7ec); padding:20px 18px 20px 16px; position:relative; }
  .hero::before { content:"✨ 지금 인기"; position:absolute; top:-12px; left:18px; background:#fff; color:var(--accent);
                  font-family:"Jua",sans-serif; font-size:13px; padding:3px 12px; border-radius:999px;
                  box-shadow:0 2px 6px rgba(0,0,0,.1); }
  .hero .icon { width:68px; height:68px; border-radius:20px; }
  .hero h2 { font-size:21px; }
  .hero p { color:#5a6a8c; }
  .hero .get { background:#25324a; }
  .note { font-size:13px; color:var(--sub); text-align:center; margin-top:26px; line-height:1.8; }
  .note a { color:var(--accent); text-decoration:none; font-family:"Jua",sans-serif; }
</style>

/* 바이오 링크에 ?src=threads 처럼 붙이면 플레이 콘솔 유입 경로에 채널이 찍힙니다.
   예: app-hub-ko.html?src=threads / ?src=x / ?src=youtube / ?src=tistory */
const src = new URLSearchParams(location.search).get("src") || "direct";

function link(url) {
  const ref = encodeURIComponent("utm_source=" + src + "&utm_medium=bio");
  return url + (url.includes("?") ? "&" : "?") + "hl=" + HL + "&referrer=" + ref;
}

function makeIcon(a) {
  const fallback = () => {
    const d = document.createElement("div");
    d.className = "icon";
    d.textContent = a.name.trim().charAt(0);
    return d;
  };
  if (!a.icon) return fallback();
  const img = document.createElement("img");
  img.className = "icon";
  img.alt = "";
  img.src = a.icon;
  img.onerror = () => img.replaceWith(fallback());
  return img;
}

const list = document.getElementById("list");
APPS.filter(a => a.url).forEach((a, i) => {
  const el = document.createElement("a");
  el.className = "card" + (i === 0 ? " hero" : "");
  el.href = link(a.url);
  if (a.tint && i !== 0) el.style.setProperty("--tint", a.tint);
  el.appendChild(makeIcon(a));
  const body = document.createElement("div");
  body.className = "body";
  body.innerHTML = "<h2></h2><p></p>";
  body.querySelector("h2").textContent = a.name;
  body.querySelector("p").textContent = a.desc;
  el.appendChild(body);
  const get = document.createElement("span");

});

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Page not found — fairfamily</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#fff7fb;color:#12203f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-align:center;padding:24px}
  h1{font-size:28px;margin:0 0 8px} p{margin:0 0 24px;opacity:.75}
  a{display:inline-block;background:#ff5da2;color:#fff;font-weight:800;padding:14px 26px;border-radius:16px;text-decoration:none}
</style>
</head>
<body>
  <div>
    <div style="font-size:48px">🌿</div>
    <h1 id="h">Page not found</h1>
    <p id="p">This page doesn’t exist — let’s head back home.</p>
    <a id="a" href="/">Go to fairfamily</a>
  </div>
  <script>
    var c=null; try{ c=localStorage.getItem('lang_choice'); }catch(e){}
    var ko=c?c==='ko':(((navigator.languages&&navigator.languages[0])||navigator.language||'').toLowerCase().indexOf('ko')===0);
    if(ko){ document.documentElement.lang='ko'; h.textContent='페이지를 찾을 수 없어요'; p.textContent='없는 페이지예요 — 홈으로 돌아갈까요?'; a.textContent='페어패밀리로 가기'; a.href='/ko/'; }
  </script>
</body>
</html>
